<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Testing — Cued</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,200;0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="../images/favicon.svg">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: 'DM Sans', -apple-system, sans-serif;
  background: #080809;
  color: #F5F5F7;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ── Nav ── */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  padding: 0 clamp(24px, 5vw, 56px);
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.nv-logo {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -.4px;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
}
.nv-logo svg { width: 24px; height: 24px; }
.nv-signup {
  background: #fff;
  color: #080809;
  font-size: 13px;
  font-weight: 600;
  padding: 8px 20px;
  border-radius: 980px;
  text-decoration: none;
  transition: opacity .2s;
}
.nv-signup:hover { opacity: .85; }

/* ── Hero ── */
.hero {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  padding: 0 clamp(32px, 7vw, 100px);
  position: relative;
  overflow: hidden;
}

/* Full-bleed background video */
.hero-video {
  position: absolute;
  inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  filter: brightness(0.28) contrast(1.1) saturate(0.6);
  z-index: 0;
  transition: opacity 1.5s ease;
}

/* Gradient overlays on top of video */
.hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 80% at 10% 50%, rgba(124,58,255,0.10) 0%, transparent 65%),
    linear-gradient(to right, rgba(0,0,0,0.82) 0%, rgba(0,0,0,0.3) 45%, rgba(0,0,0,0.65) 100%),
    linear-gradient(to bottom, rgba(0,0,0,0.45) 0%, transparent 20%, transparent 75%, rgba(0,0,0,0.6) 100%);
  z-index: 1;
  pointer-events: none;
}

/* ── Left ── */
.hero-left {
  position: relative;
  z-index: 2;
  padding-right: clamp(32px, 4vw, 80px);
}
.hero-headline {
  font-family: 'DM Sans', -apple-system, sans-serif;
  font-size: clamp(44px, 6vw, 82px);
  font-weight: 700;
  line-height: 1.05;
  letter-spacing: -2px;
  color: #fff;
  margin-bottom: 40px;
}
.hero-headline em {
  font-family: 'Playfair Display', Georgia, serif;
  font-style: italic;
  color: rgba(255,255,255,0.7);
}
.hero-cta {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  background: #7C3AFF;
  color: #fff;
  font-size: 16px;
  font-weight: 600;
  padding: 16px 28px;
  border-radius: 980px;
  text-decoration: none;
  transition: background .2s, transform .2s;
}
.hero-cta:hover { background: #6B2EE6; transform: translateY(-1px); }
.hero-cta-icon {
  width: 28px; height: 28px;
  background: rgba(255,255,255,0.2);
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; flex-shrink: 0;
}
.hero-sub {
  margin-top: 20px;
  font-size: 13px;
  color: rgba(255,255,255,0.32);
  font-weight: 300;
}

/* ── Right ── */
.hero-right {
  position: relative;
  z-index: 2;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 80px 0;
}

/* ════════════════════════════════════════════
   HYPERREALISTIC iPHONE 15 PRO
   ════════════════════════════════════════════ */
.iphone {
  position: relative;
  width: clamp(240px, 26vw, 340px);
  /* 9:19.5 ratio */
  aspect-ratio: 9 / 19.5;
  /* Slight perspective tilt */
  transform: perspective(1200px) rotateY(-6deg) rotateX(2deg);
  transform-style: preserve-3d;
  filter: drop-shadow(0 60px 80px rgba(0,0,0,0.8)) drop-shadow(0 0 40px rgba(124,58,255,0.18));
}

/* Titanium outer frame — the physical chassis */
.iphone-frame {
  position: absolute;
  inset: 0;
  border-radius: clamp(38px, 5.5vw, 54px);
  /* Titanium brushed gradient */
  background: linear-gradient(
    160deg,
    #c8c8ca 0%,
    #a0a0a2 15%,
    #7a7a7c 30%,
    #5c5c5e 45%,
    #6e6e70 55%,
    #9a9a9c 70%,
    #b8b8ba 82%,
    #888 100%
  );
  padding: 3px; /* frame thickness */
}

/* Glass back / screen surround */
.iphone-inner {
  width: 100%;
  height: 100%;
  border-radius: calc(clamp(38px, 5.5vw, 54px) - 3px);
  background: #000;
  overflow: hidden;
  position: relative;
}

/* Specular highlight — top-left sheen on frame */
.iphone-frame::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(
    135deg,
    rgba(255,255,255,0.55) 0%,
    rgba(255,255,255,0.1) 20%,
    transparent 45%,
    rgba(255,255,255,0.04) 75%,
    rgba(255,255,255,0.12) 100%
  );
  pointer-events: none;
  z-index: 10;
}

/* Screen glass glare overlay */
.iphone-glare {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(
    145deg,
    rgba(255,255,255,0.06) 0%,
    rgba(255,255,255,0.02) 30%,
    transparent 60%
  );
  z-index: 50;
  pointer-events: none;
}

/* Side buttons — power button right */
.iphone-btn-power {
  position: absolute;
  right: -4px;
  top: 28%;
  width: 3.5px;
  height: 14%;
  background: linear-gradient(to right, #6a6a6c, #9a9a9c, #7a7a7c);
  border-radius: 0 2px 2px 0;
  z-index: 20;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.3);
}

/* Volume buttons left */
.iphone-btn-vol-up {
  position: absolute;
  left: -4px;
  top: 20%;
  width: 3.5px;
  height: 9%;
  background: linear-gradient(to left, #6a6a6c, #9a9a9c, #7a7a7c);
  border-radius: 2px 0 0 2px;
  z-index: 20;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.3);
}
.iphone-btn-vol-down {
  position: absolute;
  left: -4px;
  top: 31%;
  width: 3.5px;
  height: 9%;
  background: linear-gradient(to left, #6a6a6c, #9a9a9c, #7a7a7c);
  border-radius: 2px 0 0 2px;
  z-index: 20;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.3);
}

/* Action button (mute toggle) — smaller, above vol up */
.iphone-btn-action {
  position: absolute;
  left: -4px;
  top: 13%;
  width: 3.5px;
  height: 5%;
  background: linear-gradient(to left, #6a6a6c, #9a9a9c, #7a7a7c);
  border-radius: 2px 0 0 2px;
  z-index: 20;
}

/* ── Screen content ── */
.screen {
  position: absolute;
  inset: 3px; /* inside frame padding */
  border-radius: calc(clamp(38px, 5.5vw, 54px) - 3px);
  background: #000;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* Status bar */
.s-status {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 22px 4px;
  flex-shrink: 0;
}
.s-time {
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  font-family: -apple-system, sans-serif;
  letter-spacing: -.3px;
}
.s-icons {
  display: flex;
  align-items: center;
  gap: 5px;
}
.s-signal {
  display: flex;
  align-items: flex-end;
  gap: 1.5px;
  height: 10px;
}
.s-signal span {
  width: 2.5px;
  background: #fff;
  border-radius: 1px;
}
.s-signal span:nth-child(1) { height: 30%; opacity: .4; }
.s-signal span:nth-child(2) { height: 55%; opacity: .6; }
.s-signal span:nth-child(3) { height: 80%; }
.s-signal span:nth-child(4) { height: 100%; }

.s-wifi {
  width: 14px;
  height: 10px;
  position: relative;
}
.s-wifi::before, .s-wifi::after, .s-wifi-dot {
  position: absolute;
  border: 1.5px solid #fff;
  border-radius: 50%;
  border-bottom-color: transparent;
  border-left-color: transparent;
  transform: rotate(-45deg);
}
.s-wifi::before {
  content: '';
  width: 12px; height: 12px;
  top: -1px; left: 1px;
  opacity: .5;
}
.s-wifi::after {
  content: '';
  width: 7px; height: 7px;
  top: 1.5px; left: 3.5px;
  opacity: .8;
}
.s-wifi-dot {
  width: 3px; height: 3px;
  background: #fff;
  border: none;
  border-radius: 50%;
  bottom: 0; left: 5.5px;
  transform: none;
}

.s-battery {
  display: flex;
  align-items: center;
  gap: 1px;
}
.s-battery-body {
  width: 22px; height: 11px;
  border: 1.5px solid rgba(255,255,255,0.55);
  border-radius: 3px;
  padding: 1.5px;
  position: relative;
}
.s-battery-fill {
  width: 55%;
  height: 100%;
  background: #fff;
  border-radius: 1.5px;
}
.s-battery-tip {
  width: 2px; height: 5px;
  background: rgba(255,255,255,0.55);
  border-radius: 0 1px 1px 0;
}

/* Dynamic island */
.s-island {
  width: 33%;
  height: 30px;
  background: #000;
  border-radius: 20px;
  margin: 4px auto 0;
  flex-shrink: 0;
  position: relative;
  /* subtle inner edge */
  box-shadow: 0 0 0 1px rgba(255,255,255,0.06), inset 0 1px 3px rgba(0,0,0,0.8);
}

/* Messages nav bar */
.s-imsg-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  padding: 10px 0 8px;
  border-bottom: 0.5px solid rgba(255,255,255,0.08);
  flex-shrink: 0;
}
.s-imsg-back {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 11px;
  color: #007AFF;
  font-family: -apple-system, sans-serif;
  display: flex;
  align-items: center;
  gap: 2px;
}
.s-imsg-nav-wrap {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.s-avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, #7C3AFF, #A78BFA);
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; font-weight: 700; color: #fff;
  font-family: -apple-system, sans-serif;
  flex-shrink: 0;
}
.s-contact-name {
  font-size: 12px;
  font-weight: 600;
  color: #fff;
  font-family: -apple-system, sans-serif;
  display: flex; align-items: center; gap: 2px;
}
.s-contact-name::after {
  content: '›';
  color: rgba(255,255,255,0.35);
  font-size: 13px;
}

/* Messages */
.s-msgs {
  flex: 1;
  overflow: hidden;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.s-ts {
  text-align: center;
  font-size: 9.5px;
  color: rgba(255,255,255,0.3);
  font-family: -apple-system, sans-serif;
  margin: 2px 0;
}
.s-row { display: flex; }
.s-row.them { justify-content: flex-start; }
.s-row.me   { justify-content: flex-end; }

.s-bubble {
  padding: 7px 11px;
  border-radius: 16px;
  font-size: clamp(9px, 1.3vw, 12px);
  line-height: 1.45;
  font-family: -apple-system, sans-serif;
  max-width: 80%;
}
.s-bubble.them {
  background: #2c2c2e;
  color: #fff;
  border-bottom-left-radius: 4px;
}
.s-bubble.me {
  background: #007AFF;
  color: #fff;
  border-bottom-right-radius: 4px;
}
.s-bubble.me.done { background: #34C759; }

/* Input bar */
.s-input {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 8px 12px 18px;
  border-top: 0.5px solid rgba(255,255,255,0.07);
  flex-shrink: 0;
}
.s-input-field {
  flex: 1;
  background: rgba(255,255,255,0.06);
  border: 0.5px solid rgba(255,255,255,0.12);
  border-radius: 18px;
  padding: 7px 12px;
  font-size: 10px;
  color: rgba(255,255,255,0.25);
  font-family: -apple-system, sans-serif;
}
.s-input-send {
  width: 26px; height: 26px;
  background: #007AFF;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: #fff;
  font-size: 11px;
  flex-shrink: 0;
}

/* Ambient glow beneath phone */
.iphone-glow {
  position: absolute;
  bottom: -20px;
  left: 50%;
  transform: translateX(-50%);
  width: 80%;
  height: 100px;
  background: radial-gradient(ellipse at center, rgba(124,58,255,0.25) 0%, transparent 70%);
  filter: blur(24px);
  pointer-events: none;
  z-index: -1;
}

/* ── Phone entrance animation ── */
.iphone {
  opacity: 0;
  animation: phoneEnter 1.1s cubic-bezier(.16,1,.3,1) 0.3s forwards;
}
@keyframes phoneEnter {
  0%   { opacity: 0; transform: perspective(1200px) rotateY(-6deg) rotateX(2deg) translateY(48px) scale(0.93); }
  100% { opacity: 1; transform: perspective(1200px) rotateY(-6deg) rotateX(2deg) translateY(0)    scale(1); }
}
@media (max-width: 768px) {
  @keyframes phoneEnter {
    0%   { opacity: 0; transform: perspective(1000px) rotateY(0deg) rotateX(2deg) translateY(40px) scale(0.93); }
    100% { opacity: 1; transform: perspective(1000px) rotateY(0deg) rotateX(2deg) translateY(0)    scale(1); }
  }
}

/* Glow pulse after entrance */
.iphone-glow {
  animation: glowPulse 3s ease-in-out 1.4s infinite;
}
@keyframes glowPulse {
  0%, 100% { opacity: 0.6; }
  50%       { opacity: 1; }
}

/* Hero-left entrance */
.hero-left {
  opacity: 0;
  animation: leftEnter 1s cubic-bezier(.16,1,.3,1) 0.15s forwards;
}
@keyframes leftEnter {
  0%   { opacity: 0; transform: translateY(24px); }
  100% { opacity: 1; transform: translateY(0); }
}

/* Chat bubble pop-in */
@keyframes bubbleIn {
  0%   { opacity: 0; transform: scale(0.85) translateY(6px); }
  100% { opacity: 1; transform: scale(1)    translateY(0); }
}
.s-row, .s-ts {
  opacity: 0;
}
.s-row.show, .s-ts.show {
  animation: bubbleIn 0.35s cubic-bezier(.16,1,.3,1) forwards;
}
/* Typing row just fades in — no scale */
.s-row.typing-row.show {
  animation: none;
  opacity: 1;
}

/* Typing indicator */
.typing-indicator {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 8px 12px;
  background: #2c2c2e;
  border-radius: 16px;
  border-bottom-left-radius: 4px;
  width: fit-content;
  opacity: 0;
  transition: opacity 0.2s;
}
.typing-indicator.show { opacity: 1; }
.typing-indicator span {
  width: 5px; height: 5px;
  background: rgba(255,255,255,0.5);
  border-radius: 50%;
  animation: typingDot 1.2s ease-in-out infinite;
}
.typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
@keyframes typingDot {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30%            { transform: translateY(-4px); opacity: 1; }
}

/* ── Mobile ── */
/* ── Footer ── */
footer {
  background: #060607;
  border-top: 1px solid rgba(255,255,255,0.06);
  padding: 32px clamp(24px, 5vw, 56px);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.ft-logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -.4px;
  color: rgba(255,255,255,0.5);
  text-decoration: none;
}
.ft-logo svg { width: 20px; height: 20px; opacity: .5; }
.ft-links {
  display: flex;
  gap: 24px;
  align-items: center;
}
.ft-links a {
  font-size: 12px;
  color: rgba(255,255,255,0.3);
  text-decoration: none;
  transition: color .2s;
}
.ft-links a:hover { color: rgba(255,255,255,0.7); }
.ft-copy {
  font-size: 12px;
  color: rgba(255,255,255,0.2);
}

@media (max-width: 768px) {
  .hero {
    grid-template-columns: 1fr;
    text-align: center;
    padding: 80px 24px 48px;
    gap: 36px;
    overflow-x: clip;
  }
  .hero-left { padding-right: 0; }
  .hero-cta { margin: 0 auto; }
  .hero-sub { font-size: 12px; }
  .hero-right { order: -1; }
  .iphone {
    width: min(220px, 58vw);
    transform: perspective(1000px) rotateY(0deg) rotateX(2deg);
  }
  /* Shrink font sizes inside phone on small screens */
  .s-bubble { font-size: 10px; padding: 6px 9px; }
  .s-time { font-size: 11px; }
  .s-ts { font-size: 8.5px; }
  .s-contact-name { font-size: 11px; }
  .s-avatar { width: 34px; height: 34px; font-size: 14px; }
  .s-island { height: 24px; }
  .s-status { padding: 10px 18px 2px; }
  .s-imsg-nav { padding: 8px 0 6px; }
  .s-msgs { padding: 8px 10px; gap: 5px; }
  .s-input { padding: 6px 10px 14px; }
  .s-input-field { font-size: 9px; padding: 5px 10px; }
}
</style>
</head>

  <a href="../index.html" class="nv-logo">cued</a>
  <a href="../signup.html" class="nv-signup">Sign up</a>
</nav>

      <div class="iphone-frame">

      <div class="iphone-glow"></div>
    </div><!-- /iphone -->

  </div>
</section>

<script>
(function () {

  /* ── Video crossfade ── */
  var v1 = document.getElementById('hv1');
  var v2 = document.getElementById('hv2');
  var active = v1, next = v2;
  v2.load();
  function crossfade() {
    next.currentTime = 0; next.play();
    next.style.opacity = '1'; active.style.opacity = '0';
    var tmp = active; active = next; next = tmp;
  }
  v1.addEventListener('ended', crossfade);
  v2.addEventListener('ended', crossfade);

  /* ── Chat animation ── */
  var container = document.getElementById('chatMsgs');

  // Conversation script — cycles through these on loop
  var conversations = [
    [
      { type: 'ts',   text: 'Messages · Today 6:42 AM' },
      { type: 'them', text: 'Morning. Today is a 30 min easy run + 10 min core. Ready when you are 🏃' },
      { type: 'me',   text: "let's go" },
      { type: 'them', text: 'Text "done" when you finish. I\'ll log it.' },
      { type: 'ts',   text: 'Today 7:25 AM' },
      { type: 'me',   text: 'done', cls: 'done' },
      { type: 'them', text: 'Nice work. 4 sessions this week — ahead of last week\'s 3 🔥' },
    ],
    [
      { type: 'ts',   text: 'Messages · Today 8:10 AM' },
      { type: 'them', text: 'Today is upper body — bench, rows, OHP. 45 min. I\'ll send the full plan now 💪' },
      { type: 'me',   text: 'what weight should i use for bench?' },
      { type: 'them', text: 'Start at 65% of your max. If rep 8 feels easy, go heavier next set.' },
      { type: 'me',   text: 'got it, starting now' },
      { type: 'ts',   text: 'Today 9:05 AM' },
      { type: 'me',   text: 'done. felt way stronger than last week', cls: 'done' },
      { type: 'them', text: 'That\'s the adaptation kicking in. Rest tomorrow — we\'ll hit legs Thursday 🎯' },
    ],
    [
      { type: 'ts',   text: 'Messages · Today 12:30 PM' },
      { type: 'them', text: 'Lunch check-in — how\'s the eating going today?' },
      { type: 'me',   text: 'had eggs and toast this morning, about to grab lunch' },
      { type: 'them', text: 'Nice. Aim for protein + veggies at lunch. Dining hall tip: grilled chicken + any two sides.' },
      { type: 'me',   text: 'easy, will do' },
      { type: 'them', text: 'You\'re on track for the week. Keep it up 🙌' },
    ],
  ];

  var convIndex = 0;
  var TYPING_DELAY_THEM = 1200; // ms to show typing indicator
  var TYPING_DELAY_SHORT = 700;
  var MSG_PAUSE = 600;          // pause between messages
  var END_PAUSE = 3000;         // pause at end before reset

  function sleep(ms) { return new Promise(function(r){ setTimeout(r, ms); }); }

  function addTimestamp(text) {
    var el = document.createElement('div');
    el.className = 's-ts';
    el.textContent = text;
    container.appendChild(el);
    requestAnimationFrame(function(){ el.classList.add('show'); });
    container.scrollTop = container.scrollHeight;
    return el;
  }

  function addBubble(msg) {
    var row = document.createElement('div');
    row.className = 's-row ' + msg.type;
    var bubble = document.createElement('div');
    bubble.className = 's-bubble ' + msg.type + (msg.cls ? ' ' + msg.cls : '');
    bubble.textContent = msg.text;
    row.appendChild(bubble);
    container.appendChild(row);
    requestAnimationFrame(function(){ row.classList.add('show'); });
    container.scrollTop = container.scrollHeight;
    return row;
  }

  function showTyping() {
    var row = document.createElement('div');
    row.className = 's-row them typing-row';
    var indicator = document.createElement('div');
    indicator.className = 'typing-indicator';
    indicator.innerHTML = '<span></span><span></span><span></span>';
    row.appendChild(indicator);
    container.appendChild(row);
    container.scrollTop = container.scrollHeight;
    requestAnimationFrame(function(){
      row.classList.add('show');
      indicator.classList.add('show');
    });
    return row;
  }

  async function runConversation() {
    var msgs = conversations[convIndex % conversations.length];
    convIndex++;

    // Clear old messages except the first timestamp node
    container.innerHTML = '';

    for (var i = 0; i < msgs.length; i++) {
      var msg = msgs[i];

      if (msg.type === 'ts') {
        await sleep(MSG_PAUSE);
        addTimestamp(msg.text);
        continue;
      }

      // Show typing indicator for "them" messages
      if (msg.type === 'them') {
        var typingRow = showTyping();
        await sleep(msg.text.length > 60 ? TYPING_DELAY_THEM : TYPING_DELAY_SHORT);
        typingRow.remove();
      } else {
        await sleep(MSG_PAUSE);
      }

      addBubble(msg);
      await sleep(MSG_PAUSE);
    }

    await sleep(END_PAUSE);
    runConversation();
  }

  // Start after phone entrance animation settles
  setTimeout(runConversation, 1400);

}());
</script>
</body>
